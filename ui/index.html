<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wenyi Desktop</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Wenyi</h1>
      <p class="tagline">Carry stories across languages</p>
    </header>

    <main>
      <section class="card">
        <h2>1 · 选择书籍</h2>
        <button id="pick-file">选择文件（或拖拽到这里）</button>
        <div id="drop-zone">拖入 .epub / .docx / .txt / .srt / .pdf</div>
        <div id="file-name" class="muted">未选择文件</div>
      </section>

      <section class="card">
        <h2>2 · 翻译设置</h2>
        <div class="row">
          <label>源语言
            <select id="source-lang">
              <option value="auto">自动检测</option>
              <option value="en">英语</option>
              <option value="ja">日语</option>
              <option value="ko">韩语</option>
              <option value="zh">中文</option>
            </select>
          </label>
          <label>目标语言
            <select id="target-lang">
              <option value="zh">简体中文</option>
              <option value="zh-Hant">繁体中文</option>
              <option value="en">英语</option>
              <option value="ja">日语</option>
            </select>
          </label>
        </div>
        <div class="row">
          <label><input type="checkbox" id="polish" checked /> 润色（强模型）</label>
          <label><input type="checkbox" id="review" checked /> 全书审校</label>
          <label><input type="checkbox" id="bilingual" /> 双语对照版</label>
        </div>
      </section>

      <section class="card">
        <h2>3 · API 密钥与代理</h2>
        <label>DeepSeek API Key（仅存内存，不落盘）
          <input type="password" id="api-key" placeholder="sk-..." />
        </label>
        <label>HTTP 代理（可选，例如 http://127.0.0.1:10808）
          <input type="text" id="proxy" placeholder="http://127.0.0.1:10808" />
        </label>
      </section>

      <section class="card">
        <h2>4 · 运行</h2>
        <div class="row">
          <button id="run" class="primary">开始翻译</button>
          <button id="prepare">仅准备(预扫)</button>
          <button id="cancel">取消</button>
        </div>
        <div class="progress-wrap">
          <div class="progress-bar"><div id="progress-fill"></div></div>
          <div id="progress-label" class="muted">等待开始…</div>
        </div>
        <pre id="log"></pre>
      </section>
    </main>

    <script src="main.js"></script>
  </body>
</html>
