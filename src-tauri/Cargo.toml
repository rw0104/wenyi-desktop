[package]
name = "wenyi-desktop"
version = "0.1.0"
description = "Desktop shell for Wenyi translation engine"
edition = "2021"
rust-version = "1.77"

[lib]
name = "wenyi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"