[package]
name = "wenyi-desktop"
version = "0.4.0"
description = "Desktop shell for Wenyi translation engine"
edition = "2021"
rust-version = "1.77"

[lib]
name = "wenyi_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Used only to ask the configured endpoint which models it currently serves, so a user is
# not stuck with the model id the engine preset hardcodes. rustls avoids an OpenSSL build
# dependency on Windows.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"

# API keys live in the OS credential store. Native backends only, so no D-Bus or
# libsecret system dependency is required at build time.
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
